
{% extends "base.html" %}
{% block title %}Research Automation · Wacky Packages Vault{% endblock %}
{% block content %}
<section class="hero compact-hero"><div><div class="eyebrow">EBAY RESEARCH</div><h1>Automation</h1></div></section>
<section class="panel research-form-panel">
<form method="post" class="research-form">
  <label class="checkbox-row"><input type="checkbox" name="enabled" {% if settings.get("auto_scan_enabled") == "1" %}checked{% endif %}> <span>Enable automatic eBay scans</span></label>
  <div class="field"><label>Scan interval (minutes)</label><input type="number" min="15" max="1440" name="interval" value="{{ settings.get('auto_scan_interval_minutes','30') }}"></div>
  <div class="field"><label>Mark stale after missed scans</label><input type="number" min="1" max="20" name="stale_after" value="{{ settings.get('stale_after_misses','3') }}"></div>
  <div class="research-form-actions"><button class="btn btn-primary" type="submit">Save Automation</button><a class="btn btn-secondary" href="{{ url_for('research') }}">Back</a></div>
</form>
<p class="muted">Scheduler active: {{ "Yes" if scheduler.running else "No" }} · Next run: {{ scheduler.next_run or "—" }}</p>
</section>
{% endblock %}
